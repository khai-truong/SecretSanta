<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --red:#b3261e; --green:#1e6b3a; --ink:#1f1f1f; --muted:#6b6b6b; --line:#e4ded6; --bg:#faf7f2; --card:#fff; --field:#cfc8bf; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:48px auto; padding:0 16px; }
  h1 { font-family:Georgia, serif; font-size:32px; margin:0 0 4px; }
  h2 { font-size:18px; margin:0; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  .hint { font-weight:400; color:var(--muted); font-size:14px; }
  input[type=url], input[type=text], input[type=email], textarea {
    width:100%; padding:10px 12px; border:1px solid var(--field); border-radius:8px;
    font:inherit; background:#fff; color:var(--ink); min-width:0; }
  input.bad { border-color:var(--red); background:#fff7f6; }
  textarea { min-height:72px; resize:vertical; margin-bottom:18px; }
  .linkrow { display:flex; gap:8px; }
  .check { display:flex; gap:8px; align-items:center; font-weight:400; margin-bottom:20px; }
  button { padding:12px 16px; border:0; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .primary { width:100%; background:var(--red); color:#fff; }
  .secondary { background:#fff; color:var(--red); border:1px solid var(--red); white-space:nowrap; }
  .ghost { background:none; color:var(--red); padding:8px 0; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .count { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns: 1fr 1.4fr 40px; gap:8px; align-items:center; margin-bottom:8px; }
  .grid.labels { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .remove { width:40px; height:40px; padding:0; background:none; color:var(--muted); font-size:22px; line-height:1; border-radius:8px; }
  .remove:hover { background:#f3eee8; color:var(--red); }
  .actions { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap; }
  .unsaved { font-size:14px; color:var(--muted); }
  ol { list-style:none; padding:0; margin:24px 0 0; }
  li { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); color:var(--muted); }
  li .dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--field); flex:none;
            display:grid; place-items:center; font-size:13px; color:#fff; }
  li.active { color:var(--ink); }
  li.active .dot { border-color:var(--red); border-top-color:transparent; animation:spin .8s linear infinite; }
  li.done { color:var(--ink); }
  li.done .dot { background:var(--green); border-color:var(--green); }
  li.done .dot::after { content:"✓"; }
  li.fail { color:var(--ink); }
  li.fail .dot { background:var(--red); border-color:var(--red); }
  li.fail .dot::after { content:"!"; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { margin-top:16px; padding:14px 16px; border-radius:10px; display:none; }
  .msg.ok { display:block; background:#e8f3ec; color:var(--green); }
  .msg.err { display:block; background:#fbeceb; color:var(--red); }
  .msg.info { display:block; background:#f3eee8; color:var(--ink); }
  @media (max-width:480px) {
    .linkrow { flex-direction:column; }
    .grid.labels { display:none; }
    .grid { grid-template-columns: 1fr 40px; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:10px; }
    .grid .email { grid-column:1; }
    .grid .remove { grid-column:2; grid-row:1 / span 2; }
  }
</style>
</head>
<body>
<main>
  <h1>🎅 Secret Santa</h1>
  <p class="sub">Load your sheet, check the list, then draw. Nobody's match is ever shown here.</p>

  <!-- 1. Sheet link -->
  <div class="card">
    <label for="url">Google Sheets link</label>
    <div class="linkrow">
      <input id="url" type="url" placeholder="https://docs.google.com/spreadsheets/d/…">
      <button id="load" class="secondary" type="button">Load participants</button>
    </div>
    <div id="loadMsg" class="msg"></div>
  </div>

  <div id="editor" hidden>
    <!-- 2. Participants -->
    <div class="card">
      <div class="head">
        <h2>Participants</h2>
        <span id="count" class="count"></span>
      </div>
      <div class="grid labels"><span>Name</span><span>Email</span><span></span></div>
      <div id="list"></div>
      <div class="actions">
        <button id="add" class="ghost" type="button">+ Add person</button>
        <span>
          <span id="unsaved" class="unsaved" hidden>Unsaved changes</span>
          <button id="save" class="secondary" type="button">Save to sheet</button>
        </span>
      </div>
      <div id="saveMsg" class="msg"></div>
    </div>

    <!-- 3. Draw -->
    <div class="card">
      <label for="note">Note for the email <span class="hint">(optional: budget, exchange date…)</span></label>
      <textarea id="note" placeholder="Budget is $30. Gift exchange on Dec 19!"></textarea>

      <label class="check"><input id="redo" type="checkbox"> Redo the draw if this sheet already has one</label>

      <button id="go" class="primary" type="button">Draw names &amp; send emails</button>

      <ol id="steps">
        <li data-step="save"><span class="dot"></span><span>Saving the participant list to the sheet</span></li>
        <li data-step="draw"><span class="dot"></span><span>Drawing names and saving them to the sheet</span></li>
        <li data-step="send"><span class="dot"></span><span id="sendLabel">Emailing everyone</span></li>
      </ol>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</main>

<script>
/* Privacy: the page shows names and emails so you can edit them, but never shows who
   anyone drew. Giftees are written only to the sheet and the emails. */

/* ===== ONE-TIME SETUP: paste your Google OAuth Client ID between the quotes. =====
   It identifies this app to Google (it is not secret, and users never see it). */
const CLIENT_ID = '634832757704-pj00nf0jto5c9db56g5nvvsop5v6fbii.apps.googleusercontent.com';

const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/gmail.send';
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const GMAIL_SEND = 'https://gmail.googleapis.com/gmail/v1/users/me/messages/send';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const $ = id => document.getElementById(id);
let token = null, tokenClient = null;
let state = null; // { link, tab, d (as read from the sheet), rows: [{name, email, row|null}] }

/* ---------- UI helpers ---------- */
function setState(name, s) {
  const el = document.querySelector('[data-step="' + name + '"]');
  el.classList.remove('active', 'done', 'fail');
  if (s) el.classList.add(s);
}
function show(el, text, kind) { el.className = 'msg ' + kind; el.textContent = text; }
function hide(el) { el.className = 'msg'; }

/* ---------- Google sign-in ---------- */
function signIn() {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return reject(new Error("Google's sign-in script didn't load. Check your internet connection or ad blocker and reload."));
    }
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID.trim(), scope: SCOPES, callback: () => {} });
    tokenClient.callback = resp => {
      if (resp.error) return reject(new Error('Google sign-in failed: ' + (resp.error_description || resp.error)));
      if (!google.accounts.oauth2.hasGrantedAllScopes(resp, ...SCOPES.split(' '))) {
        return reject(new Error('Please allow both Google Sheets and "Send email" access when signing in.'));
      }
      token = resp.access_token;
      setTimeout(() => { token = null; }, Math.max(60, (resp.expires_in || 3600) - 120) * 1000);
      resolve();
    };
    tokenClient.error_callback = err => {
      reject(new Error(err && err.type === 'popup_closed' ? 'The Google sign-in window was closed.'
        : err && err.type === 'popup_failed_to_open' ? 'The sign-in pop-up was blocked. Allow pop-ups for this page and try again.'
        : 'Google sign-in failed.'));
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}
async function ensureSignedIn() { if (!token) await signIn(); }

async function api(url, options) {
  const res = await fetch(url, Object.assign({}, options, {
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
  }));
  if (res.ok) return res.status === 204 ? null : res.json();
  let detail = '';
  try { detail = (await res.json()).error.message; } catch (e) {}
  if (res.status === 404) throw new Error("Couldn't find that spreadsheet. Check the link.");
  if (res.status === 403 && /has not been used|is disabled/i.test(detail)) {
    throw new Error('An API is turned off in your Google Cloud project. Enable both the Google Sheets API and the Gmail API, wait a minute, then try again.');
  }
  if (res.status === 403) throw new Error("Google refused access. Make sure your account can edit this sheet. (" + detail + ")");
  if (res.status === 401) { token = null; throw new Error('Your Google sign-in expired. Click the button again.'); }
  throw new Error('Google returned an error: ' + (detail || res.status));
}

/* ---------- Sheet helpers ---------- */
function parseLink(url) {
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (!m) throw new Error("That doesn't look like a Google Sheets link.");
  const g = url.match(/[#&?]gid=(\d+)/);
  return { id: m[1], gid: g ? Number(g[1]) : null };
}
const quote = title => "'" + title.replace(/'/g, "''") + "'";
function colLetter(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

async function openTab(link) {
  const meta = await api(SHEETS + link.id + '?fields=sheets.properties(sheetId,title,index)');
  const tabs = meta.sheets.map(s => s.properties).sort((a, b) => a.index - b.index);
  return (link.gid !== null && tabs.find(t => t.sheetId === link.gid)) || tabs[0];
}

/* Reads the sheet. strict=false allows an empty list (so you can start from a blank sheet). */
async function readSheet(link, tab) {
  const data = await api(SHEETS + link.id + '/values/' + encodeURIComponent(quote(tab.title)) + '?majorDimension=ROWS');
  const values = (data.values || []).map(r => r.map(c => String(c == null ? '' : c).trim()));

  const headers = (values[0] || []).map(h => h.toLowerCase());
  let emailCol = headers.findIndex(h => h.includes('email') || h.includes('e-mail'));
  let nameCol = headers.indexOf('name');
  if (nameCol < 0) nameCol = headers.findIndex((h, i) => h.includes('name') && i !== emailCol);
  let gifteeCol = headers.indexOf('giftee');
  let headerless = false;
  const empty = !values.some(r => r.some(c => c));

  if (empty) {
    headerless = true; nameCol = 0; emailCol = 1; gifteeCol = -1;
  } else if (emailCol < 0 || nameCol < 0) {
    const first = values[0] || [];
    const e = first.findIndex(c => EMAIL_RE.test(c));
    const n = first.findIndex((c, i) => c && i !== e);
    if (e < 0 || n < 0) {
      throw new Error('Couldn\'t find the names and emails. Put names in one column and emails in another, optionally with "Name" and "Email" headers in row 1.');
    }
    headerless = true; emailCol = e; nameCol = n; gifteeCol = -1;
  }

  const people = [];
  for (let i = headerless ? 0 : 1; i < values.length; i++) {
    const r = values[i] || [];
    const name = r[nameCol] || '', email = r[emailCol] || '';
    if (!name && !email) continue;
    people.push({ row: i + 1, name, email, giftee: gifteeCol >= 0 ? (r[gifteeCol] || '') : '' });
  }
  const width = Math.max(0, ...values.map(r => r.length));
  return { people, nameCol, emailCol, gifteeCol, headerless, rowCount: values.length, width };
}

/* Problems with a list of people, or [] if it's fine. Each problem: { index, field, text }. */
function validate(rows) {
  const problems = [], seen = {};
  rows.forEach((p, i) => {
    const n = i + 1;
    if (!p.name.trim()) problems.push({ index: i, field: 'name', text: 'Person #' + n + ' needs a name.' });
    const email = p.email.trim();
    if (!email) problems.push({ index: i, field: 'email', text: 'Person #' + n + ' needs an email address.' });
    else if (!EMAIL_RE.test(email)) problems.push({ index: i, field: 'email', text: 'Person #' + n + ' has an invalid email address.' });
    else {
      const key = email.toLowerCase();
      if (seen[key] !== undefined) problems.push({ index: i, field: 'email', text: 'People #' + (seen[key] + 1) + ' and #' + n + ' have the same email address.' });
      else seen[key] = i;
    }
  });
  return problems;
}

/* Writes the edited list back: updates changed cells, deletes removed rows, adds new ones. */
async function saveToSheet() {
  const { link, tab, d, rows } = state;
  const t = quote(tab.title);
  let offset = 0;

  if (d.headerless) {
    // Add a header row so the sheet is labelled (and the Giftee column has a home).
    await api(SHEETS + link.id + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [
      { insertDimension: { range: { sheetId: tab.sheetId, dimension: 'ROWS', startIndex: 0, endIndex: 1 }, inheritFromBefore: false } }
    ] }) });
    const header = [];
    for (let c = 0; c <= Math.max(d.nameCol, d.emailCol); c++) header.push('');
    header[d.nameCol] = 'Name'; header[d.emailCol] = 'Email';
    await api(SHEETS + link.id + '/values/' + encodeURIComponent(t + '!A1') + '?valueInputOption=RAW',
      { method: 'PUT', body: JSON.stringify({ values: [header] }) });
    offset = 1;
  }

  // 1. Changed names/emails in existing rows.
  const original = {};
  d.people.forEach(p => { original[p.row] = p; });
  const updates = [];
  rows.filter(r => r.row).forEach(r => {
    const o = original[r.row];
    if (o.name !== r.name.trim()) updates.push({ range: t + '!' + colLetter(d.nameCol) + (r.row + offset), values: [[r.name.trim()]] });
    if (o.email !== r.email.trim()) updates.push({ range: t + '!' + colLetter(d.emailCol) + (r.row + offset), values: [[r.email.trim()]] });
  });
  if (updates.length) {
    await api(SHEETS + link.id + '/values:batchUpdate', { method: 'POST',
      body: JSON.stringify({ valueInputOption: 'RAW', data: updates }) });
  }

  // 2. Removed people: delete their whole rows (bottom-up so row numbers stay valid).
  const kept = new Set(rows.filter(r => r.row).map(r => r.row));
  const removed = d.people.filter(p => !kept.has(p.row)).map(p => p.row + offset).sort((a, b) => b - a);
  const added = rows.filter(r => !r.row);
  const requests = removed.map(r => ({ deleteDimension: { range: { sheetId: tab.sheetId, dimension: 'ROWS', startIndex: r - 1, endIndex: r } } }));
  if (added.length) requests.push({ appendDimension: { sheetId: tab.sheetId, dimension: 'ROWS', length: added.length } });
  if (requests.length) {
    await api(SHEETS + link.id + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests }) });
  }

  // 3. New people go in the rows just below the existing data.
  if (added.length) {
    const start = d.rowCount + offset - removed.length + 1;
    const data = [];
    added.forEach((r, i) => {
      data.push({ range: t + '!' + colLetter(d.nameCol) + (start + i), values: [[r.name.trim()]] });
      data.push({ range: t + '!' + colLetter(d.emailCol) + (start + i), values: [[r.email.trim()]] });
    });
    await api(SHEETS + link.id + '/values:batchUpdate', { method: 'POST',
      body: JSON.stringify({ valueInputOption: 'RAW', data }) });
  }

  // Re-read so the page matches the sheet exactly.
  state.d = await readSheet(link, tab);
  state.rows = state.d.people.map(p => ({ name: p.name, email: p.email, row: p.row }));
  render();
}

function isDirty() {
  if (!state) return false;
  const { d, rows } = state;
  if (d.headerless && rows.length) return true;
  if (rows.length !== d.people.length) return true;
  return rows.some((r, i) => {
    const o = d.people[i];
    return !r.row || r.row !== o.row || r.name.trim() !== o.name || r.email.trim() !== o.email;
  });
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function writeGiftees(link, tab, d) {
  const people = d.people;
  // Everyone gives to the next person in a shuffled circle: no one draws themselves.
  const order = shuffle(people.map((_, i) => i));
  order.forEach((p, k) => { people[p].giftee = people[order[(k + 1) % order.length]].name; });

  const col = d.gifteeCol >= 0 ? d.gifteeCol : d.width;
  const column = [];
  for (let r = 1; r <= d.rowCount; r++) column.push(['']);
  column[0][0] = 'Giftee';
  people.forEach(p => { column[p.row - 1][0] = p.giftee; });
  const range = quote(tab.title) + '!' + colLetter(col) + '1:' + colLetter(col) + d.rowCount;
  await api(SHEETS + link.id + '/values/' + encodeURIComponent(range) + '?valueInputOption=RAW',
    { method: 'PUT', body: JSON.stringify({ values: column }) });
}

/* ---------- Email ---------- */
function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const wrap = s => s.replace(/.{1,76}/g, '$&\r\n');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function sendEmail(p, note) {
  const extra = note.trim();
  const plain = 'Hi ' + p.name + ',\n\nYou are the Secret Santa for: ' + p.giftee + '\n\n' +
                (extra ? extra + '\n\n' : '') + 'Keep it a secret! 🤫\n';
  const html = '<div style="font-family:Georgia,serif;font-size:16px;color:#222;line-height:1.5">' +
    '<p>Hi ' + esc(p.name) + ',</p><p>You are the Secret Santa for:</p>' +
    '<p style="font-size:26px;font-weight:bold;color:#b3261e;margin:8px 0 16px">🎁 ' + esc(p.giftee) + '</p>' +
    (extra ? '<p>' + esc(extra).replace(/\n/g, '<br>') + '</p>' : '') +
    '<p>Keep it a secret! 🤫</p></div>';
  const boundary = 'ss_' + Math.random().toString(36).slice(2);
  const mime = [
    'To: ' + p.email,
    'Subject: =?UTF-8?B?' + b64('🎅 Your Secret Santa assignment') + '?=',
    'MIME-Version: 1.0',
    'Content-Type: multipart/alternative; boundary="' + boundary + '"',
    '',
    '--' + boundary, 'Content-Type: text/plain; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(plain)),
    '--' + boundary, 'Content-Type: text/html; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(html)),
    '--' + boundary + '--', ''
  ].join('\r\n');
  const raw = b64(mime).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  await api(GMAIL_SEND, { method: 'POST', body: JSON.stringify({ raw }) });
}

/* ---------- Participant editor ---------- */
function render() {
  const list = $('list');
  list.textContent = '';
  state.rows.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'grid';

    const name = document.createElement('input');
    name.type = 'text'; name.placeholder = 'Name'; name.value = p.name;
    name.setAttribute('aria-label', 'Name of person ' + (i + 1));
    name.dataset.index = i; name.dataset.field = 'name';

    const email = document.createElement('input');
    email.type = 'email'; email.placeholder = 'name@example.com'; email.value = p.email;
    email.className = 'email';
    email.setAttribute('aria-label', 'Email of person ' + (i + 1));
    email.dataset.index = i; email.dataset.field = 'email';

    const del = document.createElement('button');
    del.type = 'button'; del.className = 'remove'; del.textContent = '×';
    del.title = 'Remove'; del.setAttribute('aria-label', 'Remove person ' + (i + 1));
    del.addEventListener('click', () => { state.rows.splice(i, 1); render(); });

    [name, email].forEach(inp => inp.addEventListener('input', () => {
      state.rows[i][inp.dataset.field] = inp.value;
      inp.classList.remove('bad');
      updateMeta();
    }));
    row.append(name, email, del);
    list.append(row);
  });
  updateMeta();
}

function updateMeta() {
  const n = state.rows.length;
  $('count').textContent = n + (n === 1 ? ' person' : ' people');
  $('unsaved').hidden = !isDirty();
}

function markProblems(problems) {
  document.querySelectorAll('#list input').forEach(inp => inp.classList.remove('bad'));
  problems.forEach(p => {
    const el = document.querySelector('#list input[data-index="' + p.index + '"][data-field="' + p.field + '"]');
    if (el) el.classList.add('bad');
  });
  const first = problems[0] && document.querySelector('#list input.bad');
  if (first) first.focus();
}

$('add').addEventListener('click', () => {
  state.rows.push({ name: '', email: '', row: null });
  render();
  const inputs = document.querySelectorAll('#list input[data-field="name"]');
  inputs[inputs.length - 1].focus();
});

// Changing the link means the loaded list no longer applies.
$('url').addEventListener('input', () => { if (state) { state = null; $('editor').hidden = true; } });

/* ---------- Load ---------- */
function preflight() {
  if (location.protocol === 'file:') {
    throw new Error("Google sign-in doesn't work on a file opened straight from your computer. Open this page from http://localhost:8000 or a hosted address (see the setup guide).");
  }
  if (!/\.apps\.googleusercontent\.com$/.test(CLIENT_ID.trim())) {
    throw new Error("This page hasn't been set up yet: whoever runs it needs to add their Google Client ID to the CLIENT_ID line in the file (see the setup guide).");
  }
}

$('load').addEventListener('click', async () => {
  const btn = $('load'), msg = $('loadMsg');
  hide(msg);
  try {
    preflight();
    const url = $('url').value.trim();
    if (!url) throw new Error('Paste your Google Sheets link first.');
    const link = parseLink(url);
    btn.disabled = true; btn.textContent = 'Loading…';
    await ensureSignedIn();
    const tab = await openTab(link);
    const d = await readSheet(link, tab);
    state = { link, tab, d, rows: d.people.map(p => ({ name: p.name, email: p.email, row: p.row })) };
    render();
    $('editor').hidden = false;
    hide($('saveMsg')); hide($('msg'));
    ['save', 'draw', 'send'].forEach(s => setState(s, null));
    $('sendLabel').textContent = 'Emailing everyone';
    if (d.people.some(p => p.giftee)) {
      show(msg, 'Heads up: this sheet already has a draw recorded. To draw again, tick "Redo the draw" below.', 'info');
    }
  } catch (err) {
    show(msg, (err && err.message) || String(err), 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Load participants';
  }
});

/* ---------- Save ---------- */
$('save').addEventListener('click', async () => {
  const msg = $('saveMsg');
  hide(msg);
  const problems = validate(state.rows);
  if (problems.length) { markProblems(problems); return show(msg, problems[0].text, 'err'); }
  if (!isDirty()) return show(msg, 'Nothing to save. The sheet already matches this list.', 'info');
  setBusy(true);
  try {
    await ensureSignedIn();
    await saveToSheet();
    show(msg, 'Saved to the sheet.', 'ok');
  } catch (err) {
    show(msg, (err && err.message) || String(err), 'err');
  } finally {
    setBusy(false);
  }
});

function setBusy(b) {
  ['load', 'save', 'go', 'add'].forEach(id => { $(id).disabled = b; });
  document.querySelectorAll('#list input, #list button').forEach(el => { el.disabled = b; });
}

/* ---------- Draw & send ---------- */
$('go').addEventListener('click', async () => {
  const msg = $('msg');
  hide(msg); hide($('saveMsg'));
  ['save', 'draw', 'send'].forEach(s => setState(s, null));
  $('sendLabel').textContent = 'Emailing everyone';

  const problems = validate(state.rows);
  if (problems.length) { markProblems(problems); return show(msg, 'Fix the list first: ' + problems[0].text, 'err'); }
  if (state.rows.length < 3) return show(msg, 'You need at least 3 participants for a proper Secret Santa.', 'err');
  if (state.d.people.some(p => p.giftee) && !$('redo').checked) {
    return show(msg, 'This sheet already has a draw recorded. Tick "Redo the draw" to replace it and re-send the emails.', 'err');
  }

  const note = $('note').value;
  setBusy(true);
  let current = 'save';
  try {
    await ensureSignedIn();

    setState('save', 'active');
    await saveToSheet(); // also re-reads, so the draw uses exactly what's in the sheet
    setState('save', 'done');

    current = 'draw';
    setState('draw', 'active');
    const { link, tab, d } = state;
    await writeGiftees(link, tab, d);
    setState('draw', 'done');

    current = 'send';
    setState('send', 'active');
    const total = d.people.length;
    for (let i = 0; i < total; i++) {
      $('sendLabel').textContent = 'Emailing everyone (' + i + ' of ' + total + ')';
      await sendEmail(d.people[i], note);
    }
    $('sendLabel').textContent = 'Emailing everyone (' + total + ' of ' + total + ')';
    setState('send', 'done');

    state.d = await readSheet(link, tab); // keep the page in sync (giftees stay hidden)
    show(msg, 'All done! ' + total + ' people have their Secret Santa email, and the matches are saved in the sheet. 🎄', 'ok');
  } catch (err) {
    setState(current, 'fail');
    show(msg, (err && err.message) || String(err), 'err');
  } finally {
    setBusy(false);
    $('redo').checked = false;
    updateMeta();
  }
});
</script>
</body>
</html>
